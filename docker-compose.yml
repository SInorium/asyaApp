services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: asya
      POSTGRES_PASSWORD: asya
      POSTGRES_DB: asya
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  # S3-совместимое хранилище для разработки (публичные образы MinIO больше не распространяются).
  # Бакет и политику публичного чтения создаёт API при старте (S3_AUTO_CREATE_BUCKET=true).
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: s3admin
      RUSTFS_SECRET_KEY: s3admin12345
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - s3data:/data

  caddy:
    image: caddy:2-alpine
    ports:
      - '8080:8080'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  pgdata:
  s3data:
